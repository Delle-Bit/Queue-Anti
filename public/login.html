<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Clinic Queue</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: url('../images/samplebg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-image 0.3s ease;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Login</h2>
        <p class="error" id="error-msg"></p>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <p style="margin-top: 15px;">
            <a href="#" onclick="showForgotModal()" style="color: var(--primary-color);">Forgot Password?</a>
        </p>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close" onclick="closeForgotModal()">&times;</span>
            <h2 style="color: var(--primary-color);">Recover Account</h2>
            <p>Enter your username. The reset instruction will be sent to the administrator's email.</p>
            <input type="text" id="forgot-username" placeholder="Username"
                style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
            <button class="btn btn-secondary" onclick="requestReset()">Request Reset</button>
            <p id="forgot-msg" style="color: green; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('adminToken', data.token); // using adminToken for simplicity across the app
                localStorage.setItem('adminRole', data.role);
                localStorage.setItem('customerCategory', data.category || 'Regular');

                if (data.role === 'customer') {
                    window.location.href = '/customer.html';
                } else {
                    window.location.href = '/adminstaff.html';
                }
            } else {
                const err = await res.json();
                errorMsg.innerText = err.error || 'Login failed';
                errorMsg.style.display = 'block';
            }
        });

        function showForgotModal() { document.getElementById('forgot-modal').style.display = 'block'; }
        function closeForgotModal() { document.getElementById('forgot-modal').style.display = 'none'; }

        async function requestReset() {
            const user = document.getElementById('forgot-username').value;
            if (!user) return;
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user })
            });
            const data = await res.json();
            const msgObj = document.getElementById('forgot-msg');
            msgObj.innerText = data.message;
            msgObj.style.display = 'block';
        }

        // Dynamic background from admin settings
        (async function applyPageBackground() {
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.bg_login) {
                        document.body.style.backgroundImage = `url('${data.bg_login}')`;
                    }
                }
            } catch (e) { /* keep fallback */ }
        })();
    </script>

</body>

</html>
