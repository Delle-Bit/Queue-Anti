<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Medical Clinic</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-overlay active" role="dialog" aria-modal="true" aria-labelledby="reset-panel-title">
        <div class="auth-panel">
            <div class="auth-panel-logo">
                <img src="/images/examplelogo.svg" alt="Logo" class="auth-panel-logo-img">
            </div>

            <!-- FORM: enter new password -->
            <div id="reset-form-view" class="auth-form" role="tabpanel">
                <div class="auth-welcome">
                    <h2 id="reset-panel-title">Reset Your Password</h2>
                    <p>Choose a new password for your account</p>
                </div>
                <div id="reset-error" class="auth-error"></div>
                <form id="reset-password-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="reset-password">New Password</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="reset-password" class="form-input input-with-icon" placeholder="Create password (min 8 chars)" required autocomplete="new-password" minlength="8">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reset-confirm-password">Confirm Password</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="reset-confirm-password" class="form-input input-with-icon" placeholder="Confirm password" required autocomplete="new-password" minlength="8">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit-btn">
                        <i class="fa-solid fa-check"></i> Reset Password
                    </button>
                </form>
            </div>

            <!-- SUCCESS -->
            <div id="reset-success-view" class="auth-form" style="display:none;" role="tabpanel">
                <div class="auth-welcome">
                    <h2><i class="fa-solid fa-circle-check" style="color:#22c55e;"></i> Password Reset</h2>
                    <p>Your password has been updated successfully.</p>
                </div>
                <a href="/index.html" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-right-to-bracket"></i> Back to Sign In
                </a>
            </div>

            <!-- INVALID/EXPIRED LINK -->
            <div id="reset-invalid-view" class="auth-form" style="display:none;" role="tabpanel">
                <div class="auth-welcome">
                    <h2><i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i> Invalid Link</h2>
                    <p>This password reset link is invalid or has expired. Reset links are valid for 1 hour.</p>
                </div>
                <a href="/index.html" class="btn btn-secondary btn-block btn-lg">
                    <i class="fa-solid fa-arrow-left"></i> Back to Sign In
                </a>
            </div>
        </div>
    </div>

    <script src="reset-password.js"></script>
</body>
</html>
