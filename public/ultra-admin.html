<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraAdmin - User Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ultra-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: var(--primary-color); color: white; }
        .action-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="ultra-container">
        <div class="action-bar">
            <h1>🛡️ UltraAdmin System</h1>
            <div>
                <a href="/admin.html" class="btn btn-secondary">Go to Clinic Admin</a>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="admin-card">
            <h2>Add New Administrator</h2>
            <input type="text" id="new-user" placeholder="Username" style="padding: 10px;">
            <input type="password" id="new-pass" placeholder="Initial Password" style="padding: 10px;">
            <button class="btn btn-success" onclick="createUser()">Create Admin</button>
        </div>

        <h2>Current Users</h2>
        <table>
            <thead><tr><th>ID</th><th>Username</th><th>Role</th></tr></thead>
            <tbody id="users-table"><tr><td colspan="3">Loading...</td></tr></tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token || localStorage.getItem('adminRole') !== 'ultraadmin') {
            window.location.href = '/login.html';
        }

        async function fetchUsers() {
            const res = await fetch('/api/users', { headers: { 'Authorization': `Bearer ${token}` }});
            if(res.ok) {
                const users = await res.json();
                let html = '';
                users.forEach(u => {
                    html += `<tr><td>${u.id}</td><td>${u.username}</td><td><span class="badge" style="background:${u.role==='ultraadmin'?'#dc3545':'#17a2b8'};color:white;padding:3px 8px;border-radius:12px;font-size:12px;">${u.role}</span></td></tr>`;
                });
                document.getElementById('users-table').innerHTML = html;
            } else {
                if(res.status === 403 || res.status === 401) {
                    alert('Session expired or unauthorized');
                    logout();
                }
            }
        }

        async function createUser() {
            const username = document.getElementById('new-user').value;
            const password = document.getElementById('new-pass').value;
            if(!username || !password) return alert('Fill fields');

            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role: 'admin' })
            });

            if(res.ok) {
                alert('User created!');
                document.getElementById('new-user').value = '';
                document.getElementById('new-pass').value = '';
                fetchUsers();
            } else {
                alert('Failed. Username might exist.');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminRole');
            window.location.href = '/login.html';
        }

        fetchUsers();
    </script>
</body>
</html>
