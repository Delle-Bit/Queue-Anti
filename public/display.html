<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Display — Medical Clinic</title>
    <link rel="icon" href="/images/examplelogo.svg">
    <link rel="stylesheet" href="display.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!--
    The public lobby board. No sign-in: it runs unattended on a wall-mounted
    screen, which is why it reads from /api/display (the one public queue
    endpoint) and why that endpoint answers with ticket numbers and station
    names only - never a patient's name.

    It deliberately does not load shared.js. That file's first act on a staff
    page is requireAuth(), and everything else in it - the idle timeout, the
    sidebar, the token helpers - is for a signed-in operator. A board has none.
-->
<body>
    <div class="disp-shell">
        <header class="disp-header">
            <div class="disp-brand">
                <img src="/images/examplelogo.svg" alt="" class="disp-logo" id="disp-logo">
                <div>
                    <div class="disp-clinic" id="disp-clinic">Medical Clinic</div>
                    <div class="disp-tagline">Now Serving — please watch for your number</div>
                </div>
            </div>
            <div class="disp-clock">
                <div class="disp-time" id="disp-time">--:--</div>
                <div class="disp-date" id="disp-date"></div>
            </div>
        </header>

        <!-- There is no "now serving" band above the grid any more. The station
             panel that is calling carries the call itself - brand gradient, the
             biggest number on the screen, a "Now calling" pill - so somebody
             walking in mid-queue reads the number and the counter to walk to
             from one place instead of two. See .disp-station.is-calling in
             display.css and dispShowAnnouncement() in display.js.

             The band was also the page's live region, so the announcement needs
             somewhere else to be spoken from: this one, rather than the grid,
             which re-renders on every ten-second poll and would read the whole
             board out each time. -->
        <div class="disp-sr-only" id="disp-live" aria-live="polite" aria-atomic="true"></div>

        <main class="disp-grid" id="disp-grid"></main>

        <footer class="disp-footer">
            <div id="disp-status">Connecting…</div>
            <div class="disp-actions">
                <!-- Browsers refuse audio until the page has been interacted
                     with, so the board asks for that one click rather than
                     appearing to work and never making a sound. -->
                <button class="disp-btn" id="disp-sound" data-on="false" onclick="dispToggleSound()">
                    <i class="fa-solid fa-volume-xmark" id="disp-sound-icon"></i>
                    <span id="disp-sound-label">Enable sound</span>
                </button>
                <!-- Set once when the board is mounted, like the other two.
                     A lobby with windows wants the light palette; a basement
                     waiting room does not. -->
                <button class="disp-btn" id="disp-theme" onclick="dispToggleTheme()">
                    <i class="fa-solid fa-sun" id="disp-theme-icon"></i>
                    <span id="disp-theme-label">Light mode</span>
                </button>
                <button class="disp-btn" onclick="dispToggleFullscreen()">
                    <i class="fa-solid fa-expand"></i> Fullscreen
                </button>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="display.js"></script>
</body>
</html>
