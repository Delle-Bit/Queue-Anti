<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Clinic Queue</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: url('images/samplebg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-image 0.3s ease;
        }
        .landing-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .btn-large {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.2em;
            text-decoration: none;
            box-sizing: border-box;
        }
        .site-title { color: var(--primary-color); margin-bottom: 30px; font-size: 2.2em;}
    </style>
</head>
<body>
    <div class="landing-card">
        <h1 class="site-title"><i class="fa-solid fa-hospital-user"></i> Medical Clinic</h1>
        <p style="font-size: 1.1em; color: #555; margin-bottom: 30px;">Welcome to our automated queue management system.</p>
        
        <a href="login.html" class="btn btn-primary btn-large"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        <a href="register.html" class="btn btn-secondary btn-large"><i class="fa-solid fa-user-plus"></i> Customer Registration</a>
    </div>
    <script>
        // Dynamic background from admin settings
        (async function applyPageBackground() {
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.bg_index) {
                        document.body.style.backgroundImage = `url('${data.bg_index}')`;
                    }
                }
            } catch (e) { /* keep fallback */ }
        })();
    </script>
</body>
</html>
