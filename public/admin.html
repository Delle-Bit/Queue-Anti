<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEA Clinic - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header class="main-header">
        <div class="logo">
            <span class="material-symbols-rounded">admin_panel_settings</span>
            JEA Clinic Admin Panel
        </div>
    </header>

    <div class="admin-container">
        <!-- Control Panel -->
        <div class="admin-card">
            <h2>Queue Controls</h2>
            
            <div class="queue-status-board" style="padding: 20px;">
                <p class="label">Now Serving</p>
                <h1 id="admin-current-serving" style="color: var(--primary-color); font-size: 3rem; margin: 0;">--</h1>
            </div>

            <div class="admin-controls">
                <button class="btn btn-success" style="flex:1;" onclick="callNext()">📢 Call Next Patient</button>
                <button class="btn btn-danger" style="flex:1;" onclick="resetQueue()">🔄 Reset Queue</button>
            </div>
            
            <hr>
            
            <h3>Broadcast Announcement</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="announcement-input" placeholder="Enter announcement message...">
                <button class="btn btn-secondary" onclick="broadcast()">Send</button>
            </div>

            <hr>
            
            <h3>Clinic Operations</h3>
            <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer;">
                <input type="checkbox" id="clinic-status-toggle" style="width:20px; height:20px;" onchange="toggleClinicStatus()">
                Clinic is Online
            </label>

            <hr>
            
            <h3>Patient Queue QR Code</h3>
            <div id="qrcode-container" style="text-align: center; padding: 10px; background: #fff; border-radius: 8px;">
                Loading QR...
            </div>
        </div>

        <!-- Dashboard & Logistics -->
        <div class="admin-card">
            <h2>Live Statistics</h2>
            
            <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                <div class="metric" style="background: #E8F4F8; padding: 15px; border-radius: 8px; flex: 1;">
                    <p class="metric-label" style="font-weight:600; color:var(--primary-color)">Patients Waiting</p>
                    <p class="metric-value" style="font-size: 2rem;" id="pending-count">0</p>
                </div>
                <div class="metric" style="background: #E8F8F5; padding: 15px; border-radius: 8px; flex: 1;">
                    <p class="metric-label" style="font-weight:600; color:var(--accent-color)">Total Served Today</p>
                    <p class="metric-value" style="font-size: 2rem;" id="total-served">0</p>
                </div>
            </div>

            <canvas id="queueChart" style="background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #EAECEE;"></canvas>
        </div>
    </div>

    <!-- Switch from type="module" to normal script since we removed firebase -->
    <script src="admin.js"></script>
</body>

</html>
